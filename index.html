<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one-column app shell with a sticky tab bar; Today is a stack of routine cards in time order, Week a day-by-day load view against the 4-hour limit */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --sunk:#eceee8; --fg:#1f2421; --muted:#5d665f; --line:#d9ddd5;
  --temple:#2f7d6b; --mind:#4d5bb5; --quest:#2f6fa0; --kitchen:#b0532c; --home:#a8721a; --garden:#5f7f12; --play:#b04a6a;
  --over:#b8432f; --soon:#a8721a; --ok:#2f7d6b; --on-accent:#ffffff;
  --heat0:#e6ece4; --heat1:#bfdccf; --heat2:#7fbfa9; --heat3:#3f9a80; --heat4:#b8432f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141715; --surface:#1c201d; --sunk:#232825; --fg:#e8ebe6; --muted:#9aa49d; --line:#323834;
  --temple:#5cc0a6; --mind:#8e9af0; --quest:#78b2e0; --kitchen:#ee9068; --home:#e0a94a; --garden:#a8c95a; --play:#e27f9d;
  --over:#f08a74; --soon:#e0a94a; --ok:#5cc0a6; --on-accent:#141715;
  --heat0:#232825; --heat1:#1f4a3e; --heat2:#2c6f5c; --heat3:#3f9a80; --heat4:#a8453a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1c201d; --sunk:#232825; --fg:#e8ebe6; --muted:#9aa49d; --line:#323834;
  --temple:#5cc0a6; --mind:#8e9af0; --quest:#78b2e0; --kitchen:#ee9068; --home:#e0a94a; --garden:#a8c95a; --play:#e27f9d;
  --over:#f08a74; --soon:#e0a94a; --ok:#5cc0a6; --on-accent:#141715;
  --heat0:#232825; --heat1:#1f4a3e; --heat2:#2c6f5c; --heat3:#3f9a80; --heat4:#a8453a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1100px;margin:0 auto}
header.top{padding-block:22px 6px}
header.top .shell{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:14px}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:700;color:var(--muted)}
.pill.demo{background:color-mix(in srgb,var(--mind) 18%,transparent);color:var(--mind)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .shell{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:12px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;border-radius:0}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
main{padding-block:20px 64px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.sec-head h2{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.stack{display:grid;gap:16px}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px;align-content:start}
.card h3{font-family:var(--display);font-size:17px;margin:0;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h3 .t{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--muted));display:inline-block}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mind);outline-offset:1px}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--fg)}
button.x{border:0;background:none;color:var(--muted);padding:2px 6px;font-size:16px;line-height:1}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.list{display:grid;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}
.lbl{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.lbl b{font-weight:700}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.over{background:color-mix(in srgb,var(--over) 16%,transparent);color:var(--over)}
.tag.soon{background:color-mix(in srgb,var(--soon) 18%,transparent);color:var(--soon)}
.tag.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.tag.new{background:var(--sunk);color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-weight:700;text-align:left;width:100%;white-space:normal}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:var(--on-accent)}
.check.on .box{background:var(--c,var(--ok));border-color:var(--c,var(--ok))}
.check.on .nm{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.check .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.check .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.checks{display:grid;gap:8px}
.routine{padding:0;gap:0;overflow:hidden}
.routine>.rh{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 18px;border:0;background:none;border-radius:0;width:100%;text-align:left;white-space:normal}
.routine>.rh .nm{font-family:var(--display);font-size:17px;display:flex;align-items:center;gap:8px}
.routine>.rh .when{font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}
.routine .body{padding:0 18px 16px;display:grid;gap:8px}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:700}
.prog .meter{width:70px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--c,var(--temple));border-radius:99px}
.capbar{display:grid;gap:6px}
.capbar .meter{height:12px}
.capbar .meter i.over{background:var(--over)}
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.walk svg{width:100%;height:auto;display:block;overflow:visible}
.walk .wk-path{stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 8}
.walk .wk-done{stroke:var(--temple);stroke-width:4;stroke-linecap:round}
.walk .wk-dot{fill:var(--surface);stroke:var(--line);stroke-width:2}
.walk .wk-dot.on{fill:var(--temple);stroke:var(--temple)}
.walk .wk-flag line{stroke:var(--fg);stroke-width:2}
.walk .wk-flag path{fill:var(--play)}
.walk .wk-label{fill:var(--muted);font-size:9px;font-family:var(--body)}
.walker circle{fill:var(--fg)}
.walker line{stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.walker .leg,.walker .arm{transform-box:fill-box;transform-origin:top center}
@media (prefers-reduced-motion: no-preference){
  .walker.go .l1,.walker.go .a2{animation:swing .9s ease-in-out infinite alternate}
  .walker.go .l2,.walker.go .a1{animation:swing .9s ease-in-out infinite alternate-reverse}
  .walker.go .bob{animation:bob .45s ease-in-out infinite alternate}
  .walker.cheer .bob{animation:hop .6s ease-in-out infinite alternate}
}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.themebtn{display:inline-flex;gap:6px;align-items:center}
.daygrid{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(7,minmax(22px,1fr));gap:4px;align-items:center;font-size:12.5px}
.daygrid .h{color:var(--muted);text-align:center;font-weight:700}
.daygrid .cell{height:20px;border-radius:5px;background:var(--sunk)}
.daygrid .cell.on{background:var(--c,var(--temple))}
.daygrid .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.optcol{display:grid;gap:8px;align-content:start}
.optcol h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--kitchen)}
.optchips{display:flex;flex-wrap:wrap;gap:6px}
.optchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:999px;background:color-mix(in srgb,var(--kitchen) 12%,transparent);font-size:13px}
.optchip button{border:0;background:none;padding:0 6px;color:var(--muted);font-size:15px}
.optchip button.optname{color:var(--fg);font-size:13px;font-weight:400;padding:0 2px 0 0;white-space:normal;text-align:left}
.cellwrap{display:flex;gap:2px;align-items:center}
.cellwrap button{padding:4px 6px;border:0;background:none;color:var(--muted);font-size:15px}
.picks{display:grid;gap:10px}
.picks h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hostsec .due{font-size:12px;font-weight:700;color:var(--play)}
.list li .check{width:auto;flex:1 1 0;min-width:0}
@media (max-width:620px){
  main .meals table,main .meals tbody{display:block;min-width:0;width:100%}
  .meals td .cellwrap{min-width:0}
  .meals thead{display:none}
  .meals tr{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 0;border-top:1px solid var(--line)}
  .meals tr:first-child{border-top:0}
  .meals th{padding:0}
  .meals td{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:6px;padding:0}
  .meals td::before{content:attr(data-l);font-size:12px;color:var(--muted)}
}
.check .nm small.why{color:var(--c,var(--ok));font-style:italic}
.check.on .nm small.why{color:var(--muted)}
.why-line{color:var(--temple);font-weight:700}
.glass{width:30px;height:40px;border:2px solid var(--temple);border-radius:3px 3px 9px 9px;position:relative;overflow:hidden;padding:0;background:none;cursor:pointer}
.glass:hover{background:color-mix(in srgb,var(--temple) 12%,transparent)}
.glass.full::after{content:"";position:absolute;inset:30% 0 0;background:color-mix(in srgb,var(--temple) 55%,transparent)}
.timer{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--mind) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--mind) 40%,var(--line));border-radius:14px;padding:12px 16px}
.timer .clock{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.days{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .dn b{display:block;font-family:var(--display);font-size:16px}
.dayrow .dn span{font-size:12.5px;color:var(--muted)}
.dayrow.today .dn b{color:var(--temple)}
.loadline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.loadtrack{height:12px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.loadtrack i{position:absolute;inset:0 auto 0 0;background:var(--temple);border-radius:4px}
.loadtrack i.over{background:var(--over)}
.loadtrack b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);display:inline-flex;gap:5px;align-items:center}
.chip .dot{width:7px;height:7px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center;font-weight:700}
.day{border:0;border-radius:8px;padding:6px 4px;min-height:50px;display:grid;align-content:space-between;justify-items:start;text-align:left;font-weight:400;white-space:normal;color:var(--fg)}
.day .d{font-size:11.5px;color:var(--muted)} .day .m{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.day.l0{background:var(--heat0)} .day.l1{background:var(--heat1)} .day.l2{background:var(--heat2)} .day.l3{background:var(--heat3);color:var(--surface)} .day.l4{background:var(--heat4);color:var(--surface)}
.day.l3 .d,.day.l4 .d{color:inherit;opacity:.85}
.day[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:16px;height:12px;border-radius:3px;display:inline-block}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 150px 86px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .lbl span{font-size:12.5px;color:var(--muted)}
.prow select,.prow input{font-size:13px;padding:5px 7px;width:100%}
.minwrap{position:relative;display:block}
.minwrap input{padding-right:32px;font-variant-numeric:tabular-nums}
.minwrap span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);pointer-events:none}
.theme h4{margin:4px 0 2px;font-family:var(--display);font-size:16px;color:var(--c)}
details.theme{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
details.theme summary{cursor:pointer;padding:4px 0}
.meals{overflow-x:auto}
.meals table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.meals th{text-align:left;color:var(--muted);font-weight:700;padding:4px 6px}
.meals td{padding:3px} .meals td input{width:100%}
.meals tr.today th{color:var(--kitchen)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:4px;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
table.data td{padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.data .r{text-align:right}
.scroll{overflow-x:auto}
.sugg{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.sugg li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.sugg li .dot{margin-top:6px}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:start}
form.inline{display:flex;gap:8px;flex-wrap:wrap}
form.inline input{flex:1 1 140px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0 1px;font-size:16px;color:var(--line)}
.stars button.on{color:var(--play)}
.switches{display:grid;gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;width:100%;white-space:normal;text-align:left}
.switch .knob{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"] .knob{background:var(--c,var(--ok))}
.switch[aria-checked="true"] .knob::after{left:16px}
.switch .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 40%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--surface);border-radius:16px;border:1px solid var(--line);width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.dialog h3{font-family:var(--display);margin:0;font-size:20px}
.field{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{font-weight:400;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;padding:0}
@media (prefers-reduced-motion: no-preference){ .meter i,.bar .track i,.loadtrack i{transition:width .3s ease} }
@media (max-width:560px){
  .brand h1{font-size:30px}
  .prow{grid-template-columns:1fr 84px}

/* ================= schedule: when does each task happen ================= */
function defaultType(f){ return f === 1 ? "daily" : f === 2 ? "alt" : f === 7 ? "days" : f < 30 ? "every" : "monthly"; }

    const preps = u.members.filter(x => x.prep).map(x => x.prep);
    let best = null, bc = Infinity;
    candidates(t0).forEach(s => { const delta = new Map(), bump = (i, v) => { if (i >= 0) delta.set(i, (delta.get(i) || 0) + v); };
      for (let i = 0; i < H; i++) if (hits(s, infos[i])){ bump(i, size); preps.forEach(p => bump(i - p.lead, p.min)); }
      if (!delta.size) return;
      let cost = 0; delta.forEach((dv, i) => { const v = load[i] + dv, over = u.counts ? Math.max(0, v - capM) : 0; cost += over * 1000 + v * v; });
      if (cost < bc){ best = s; bc = cost; } });
    if (best){ m.slots[u.key] = best; add(u, best); } });
  fresh();
}

/* ================= derived ================= */
function doneOn(id, date){ return LOGS().find(l => l.task === id && l.date === date); }
function lastDone(id){ let b = null; for (const l of LOGS()) if (l.task === id && (!b || l.date > b)) b = l.date; return b; }
function inRange(days){ const from = addDays(today(), -(days - 1)); return LOGS().filter(l => l.date >= from && l.date <= today()); }
function lastNDates(n){ return Array.from({length:n}, (_, i) => addDays(today(), i - n + 1)); }
function water(date){ return (M().water || {})[date] || 0; }
function zoneFor(date){ const s = wd(date); if (s === 6) return null; return {n:s % 3, text:(M().zones || ZONES_DEFAULT)[s % 3]}; }
function carried(){ // non-daily tasks from the last 6 days that never got done
  const out = [], t0 = today(), since = M().startedOn || t0;
  TASKS().filter(t => t.freq >= 3 && !t.stack).forEach(t => {
    for (let k = 1; k <= Math.min(6, t.freq - 1); k++){ const d = addDays(t0, -k); if (d < since) break;
      if (occEff(t, d)){ if (isOff(d)) break; if (!LOGS().some(l => l.task === t.id && l.date >= d)) out.push({t, from:d}); break; } } });
  return out;
}

function checkItem(it, date){

function currentStack(groups){
  const h = new Date().getHours() + (new Date().getHours() < 4 ? 24 : 0);
  const unfinished = STACKS.filter(s => (groups[s.id] || []).some(it => !doneOn(it.kind === "prep" ? it.t.id + ":prep" : it.t.id, today())));

}

function capCard(p){

function viewToday(){

// a little person walking toward today's flag: one step per finished task, plus one for the water goal
function goalWalk(done, total){

  const left = total - done, cheer = fin ? "You reached today's flag. Rest is part of the plan."

      <text x="${x1 + 10}" y="${y + 18}" text-anchor="middle" class="wk-label">Goal</text>
      <g transform="translate(${x.toFixed(1)} ${y - 1}) scale(1.45)"><g class="walker ${fin ? "cheer" : "go"}"><g class="bob">
        <circle cx="0" cy="-30" r="5.5"/><line x1="0" y1="-24" x2="0" y2="-11"/>${arms}
        <g class="leg l1"><line x1="0" y1="-11" x2="0" y2="0"/></g><g class="leg l2"><line x1="0" y1="-11" x2="0" y2="0"/></g>
      </g></g></g>
    </svg>

const OFF_REASONS = ["Festival","Emergency","Long day out","Travel","Unwell","Just need a break"];

function viewWeek(){

const MEAL_NAMES = {B:"Breakfast", L:"Lunch", D:"Dinner"};
// pick a dish for each empty (or every) day: no repeats inside the week while options last, avoid last week's picks, never the same dish two days running
function suggestMenu(all){
  const m = M(), opts = m.mealOptions || {B:[], L:[], D:[]};
  if (all) m.lastMenu = {B:DAYS.map(d => m.meals[d]?.B).filter(Boolean), L:DAYS.map(d => m.meals[d]?.L).filter(Boolean), D:DAYS.map(d => m.meals[d]?.D).filter(Boolean)};
  ["B","L","D"].forEach(k => { const pool = opts[k] || []; if (!pool.length) return;
    const last = new Set((m.lastMenu || {})[k] || []);
    const used = new Set(all ? [] : DAYS.map(d => m.meals[d]?.[k]).filter(Boolean));
    DAYS.forEach((d, i) => { m.meals[d] = m.meals[d] || {}; if (!all && m.meals[d][k]) return;
      m.meals[d][k] = pickDish(pool, used, last, i ? m.meals[DAYS[i - 1]]?.[k] : null); used.add(m.meals[d][k]); }); });
}
function pickDish(pool, used, last, prev, next){
  const ok = x => x !== prev && x !== next;
  const tiers = [pool.filter(x => !used.has(x) && !last.has(x) && ok(x)), pool.filter(x => !used.has(x) && ok(x)), pool.filter(ok), pool];
  const t = tiers.find(x => x.length); return t[Math.floor(Math.random() * t.length)];
}

function streak(id){ let n = 0, d = doneOn(id, today()) ? today() : addDays(today(), -1);

function stats(days){
  const logs = inRange(days).filter(l => !l.skip), dates = lastNDates(days);
  const byArea = {}, byTask = {}, byPart = {Morning:0, Afternoon:0, Evening:0, Night:0};
  logs.forEach(l => { const t = task(l.task.replace(/:prep$/, "")), min = +l.min || 0;
    byArea[t.area] = (byArea[t.area] || 0) + min;
    const bt = byTask[t.id] = byTask[t.id] || {t, n:0, min:0}; bt.n++; bt.min += min;
    const h = l.hour ?? 12; byPart[h < 5 ? "Night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : h < 22 ? "Evening" : "Night"] += min; });
  const total = Object.values(byArea).reduce((a, b) => a + b, 0);
  const counted = dates.map(d => logs.filter(l => l.date === d && task(l.task.replace(/:prep$/, "")).counts).reduce((a, l) => a + (+l.min || 0), 0));
  const workouts = TASKS().filter(t => t.workout);
  let wPlan = 0, wDone = 0; dates.forEach(d => workouts.forEach(t => { if (occurs(t, d) && !isOff(d)){ wPlan++; if (doneOn(t.id, d)) wDone++; } }));
  const wDays = dates.filter(d => workouts.some(t => doneOn(t.id, d))).length;
  const routine = TASKS().filter(t => t.stack && t.freq <= 2 && (M().showDaily || t.freq !== 1)).map(t => { const planned = dates.filter(d => occurs(t, d) && !isOff(d)); return {t, pct: planned.length ? Math.round(planned.filter(d => doneOn(t.id, d)).length / planned.length * 100) : 0}; });
  const waterDays = dates.filter(d => water(d) >= M().waterGoal).length;
  const overCap = counted.filter(v => v > M().cap * 60).length;
  return {days, logs, total, byArea, byTask, byPart, wPlan, wDone, wDays, routine, waterDays, overCap, avgCounted:counted.reduce((a, b) => a + b, 0) / days};
}
function suggestions(s){
  const out = [];
  const wp = s.wPlan ? Math.round(s.wDone / s.wPlan * 100) : 0;
  if (wp < 70) out.push(["temple", `Workouts happened ${wp}% of the times they were planned. You said this is the one you snooze, so on a low day do just 5 minutes of skipping right after deep breathing. It still counts and keeps the streak alive.`]);
  else out.push(["temple", `Workouts happened ${wp}% of the time. The morning stack is working, so keep it in that order.`]);
  const weak = s.routine.filter(r => r.pct < 60).sort((a, b) => a.pct - b.pct)[0];
  if (weak) out.push([weak.t.area, `${weak.t.label} happened on ${weak.pct}% of planned days. Move it next to a routine item you never skip.`]);
  if (s.overCap) out.push(["home", `${plural(s.overCap, "day")} went over your ${M().cap}-hour limit. Open Week to see which jobs pile up, and tap Later on one of them.`]);
  if (s.waterDays < s.days * 0.6) out.push(["temple", `You reached your water goal on ${s.waterDays} of ${s.days} days. Have a glass with each item in the morning stack.`]);
  const top = Object.values(s.byTask).filter(x => x.t.counts).sort((a, b) => b.min - a.min)[0];
  if (top) out.push([top.t.area, `Your biggest counted block was ${top.t.label}: ${fmtMin(top.min)} over ${plural(top.n, "session")}.`]);
  if (!(s.byArea.play)) out.push(["play", `No fun logged in the last ${s.days} days. Sunday is movie day, so pick one from your list.`]);
  return out.filter(([a]) => !hiddenArea(a));
}

}
function closeDlg(){ $("#layer").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer").innerHTML) closeDlg(); });
let toastTimer;
function toast(msg, actLabel, fn){
  clearTimeout(toastTimer); document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actLabel){ const b = document.createElement("button"); b.type = "button"; b.textContent = actLabel; b.onclick = () => { el.remove(); fn(); }; el.appendChild(b); }
  document.body.appendChild(el); toastTimer = setTimeout(() => el.remove(), 5000);
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.classList.contains("overlay") && e.target !== b) return;
  const act = b.dataset.act, v = b.dataset.v, m = M();
  switch (act){
    case "tab": S.tab = v; try { localStorage.setItem("tend.tab", v); } catch(_){} draw(); window.scrollTo(0, 0); break;
    case "log": openLog(v || null); break;
    case "close-dlg": closeDlg(); break;
    case "start-timer": { const id = $("#lf-task").value; closeDlg(); m.timer = {task:id, start:Date.now()}; saveMain(); break; }
    case "timer-cancel": m.timer = null; saveMain(); break;
    case "timer-stop": { const t = m.timer; m.timer = null; saveMain(); openLog(t.task, {min:Math.max(1, Math.round((Date.now() - t.start) / 60000)), hour:new Date(t.start).getHours()}); break; }
    case "toggle-stack": { const cur = b.getAttribute("aria-expanded") === "true"; S.open[v] = !cur; draw(); break; }
    case "tick": { const ex = doneOn(v, today()); if (ex) removeLog(ex.id, true);
      else { addLog({task:v, date:today(), min:+b.dataset.min || 0}); const t = task(v.replace(/:prep$/, "")); toast(`Done! That's ${motive(t)}.`); } break; }
    case "skip": addLog({task:v, date:today(), min:0, skip:true}); toast(`Skipped ${task(v).label} this time.`); break;
    case "del-log": removeLog(v); break;
    case "glass": { const d = today(), full = Math.floor(water(d) / m.glass), i = +v; m.water = m.water || {};
      const before = water(d); m.water[d] = (i === full - 1 ? i : i + 1) * m.glass; waterCheer(before, m.water[d]); saveMain(); break; }
    case "water": { const d = today(), before = water(d); m.water = m.water || {}; m.water[d] = Math.max(0, (m.water[d] || 0) + (+v) * m.glass); waterCheer(before, m.water[d]);
      const cut = addDays(d, -100); Object.keys(m.water).forEach(k => { if (k < cut) delete m.water[k]; }); saveMain(); break; }
    case "wday": S.weekDay = +v; draw(); break;
    case "pickday": S.pickDay = +v; draw(); break;
    case "off-form": S.offForm = true; draw(); break;
    case "off-cancel": S.offForm = false; draw(); break;
    case "off-end": { const [a, bEnd] = offRange(today()); m.offDays = m.offDays || {}; for (let d = today(); d <= bEnd; d = addDays(d, 1)) delete m.offDays[d]; toast("Tend is back on. Today's list is ready."); saveMain(); break; }
    case "off-del": delete m.offDays[v]; saveMain(); break;
    case "off-move": { const [, until] = offRange(today()); m.moves = m.moves || {}; m.moves[mvKey(v, b.dataset.from)] = addDays(until, 1); toast(`${task(v).label} moved to ${fmtDate(addDays(until, 1))}.`); saveMain(); break; }
    case "theme": { const order = ["auto","light","dark"], cur = getTheme(); setTheme(order[(order.indexOf(cur) + 1) % 3]); break; }
    case "backup": { const blob = new Blob([JSON.stringify({app:"tend", version:3, saved:new Date().toISOString(), main:S.main, logs:S.logs})], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `tend-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Backup downloaded. Keep it in Files or iCloud."); break; }
    case "restore-no": S.pendingRestore = null; draw(); break;
    case "restore-yes": { const d = S.pendingRestore.data; S.main = Object.assign(defaults(), d.main || {}); S.logs = d.logs || []; S.pendingRestore = null; fresh(); ensureSlots(); saveLocal(); draw(); toast("Backup restored."); break; }
    case "show-daily": m.showDaily = !m.showDaily; toast(m.showDaily ? "Daily routines are back on Today." : "Daily routines hidden."); saveMain(); break;
    case "pull": case "later": case "putback": { m.moves = m.moves || {}; const t = task(v), from = b.dataset.from, cut = addDays(today(), -30);
      Object.keys(m.moves).forEach(k => { if (m.moves[k] < cut) delete m.moves[k]; });
      if (act === "pull"){ m.moves[mvKey(v, from)] = today(); toast(`${t.label} moved from ${fmtDate(from)} to today.`); }
      else if (act === "putback"){ delete m.moves[mvKey(v, from)]; toast(`${t.label} is back on ${fmtDate(from)}.`); }
      else { const orig = Object.keys(m.moves).find(k => k.startsWith(v + "@") && m.moves[k] === today()); m.moves[orig || mvKey(v, today())] = addDays(today(), 1); toast(`${t.label} moved to tomorrow.`); }
      saveMain(); break; }
    case "respread": respread(true); toast("Re-spread your year."); saveMain(); break;
    case "area-toggle": { m.hidden = m.hidden || []; const on = m.hidden.includes(v); m.hidden = on ? m.hidden.filter(a => a !== v) : m.hidden.concat(v); saveMain(); break; }
    case "custom-del": m.custom = m.custom.filter(c => c.id !== v); delete m.slots[v]; saveMain(); break;
    case "supply-toggle": { const it = m.supply[+v], wk = addDays(today(), -wd(today())); it.w = it.w === wk ? "" : wk; saveMain(); break; }
    case "supply-del": m.supply.splice(+v, 1); saveMain(); break;
    case "opt-del": m.mealOptions[b.dataset.k].splice(+v, 1); S.editOpt = null; saveMain(); break;
    case "opt-edit": S.editOpt = {k:b.dataset.k, i:+v}; draw(); setTimeout(() => { const n = document.getElementById("optedit"); if (n){ n.focus(); n.select(); } }, 0); break;
    case "opt-edit-cancel": S.editOpt = null; draw(); break;
    case "suggest": suggestMenu(v === "all"); toast(v === "all" ? "Here's a fresh week. Tap ↻ to swap anything." : "Filled the empty days."); saveMain(); break;
    case "reroll": { const d = b.dataset.d, k = b.dataset.k, i = DAYS.indexOf(d); m.meals[d] = m.meals[d] || {};
      const cur = m.meals[d][k], prev = i ? m.meals[DAYS[i - 1]]?.[k] : null, next = m.meals[DAYS[i + 1]]?.[k];
      const cands = (m.mealOptions[k] || []).filter(x => x !== cur && x !== prev && x !== next);
      if (!cands.length){ toast("No other dish fits here without repeating the day before or after. Add more options."); break; }
      const used = new Set(DAYS.filter(x => x !== d).map(x => m.meals[x]?.[k]).filter(Boolean));
      m.meals[d][k] = pickDish(cands, used, new Set(), null, null); saveMain(); break; }
    case "host-tick": { const ev = curEvent(); ev.checks[v] = !ev.checks[v]; if (!ev.checks[v]) delete ev.checks[v]; saveMain(); break; }
    case "host-del": { const ev = curEvent(); ev.custom = ev.custom.filter(c => c.id !== v); delete ev.checks["c:" + v]; saveMain(); break; }
    case "event-new": S.newEvent = true; draw(); break;
    case "li-tick": { const l = m.lists.find(x => x.id === b.dataset.l), it = l && l.items.find(x => x.id === v); if (it){ it.done = !it.done; saveMain(); } break; }
    case "li-del": { const l = m.lists.find(x => x.id === b.dataset.l); if (l){ l.items = l.items.filter(x => x.id !== v); saveMain(); } break; }
    case "li-clear": { const l = m.lists.find(x => x.id === b.dataset.l); if (l){ const n = l.items.filter(x => x.done).length; l.items = l.items.filter(x => !x.done); toast(`Cleared ${plural(n, "ticked item")}.`); saveMain(); } break; }
    case "list-del": S.delList = b.dataset.l; draw(); break;
    case "list-del-no": S.delList = null; draw(); break;
    case "list-del-yes": m.lists = m.lists.filter(x => x.id !== b.dataset.l); S.delList = null; saveMain(); break;
    case "event-cancel": S.newEvent = false; draw(); break;
    case "event-del": S.delEvent = true; draw(); break;
    case "event-del-no": S.delEvent = false; draw(); break;
    case "event-del-yes": { const ev = curEvent(); m.events = m.events.filter(e => e.id !== ev.id); m.activeEvent = m.events[0]?.id || null; S.delEvent = false; saveMain(); break; }
    case "fun-done": { const k = b.dataset.k; m[k][+b.dataset.i].done = true; saveMain(); openLog({movies:"movie", picnics:"picnic"}[k]); break; }
    case "fun-del": m[b.dataset.k].splice(+b.dataset.i, 1); saveMain(); break;
    case "rate": m[b.dataset.k][+b.dataset.i].r = +v; saveMain(); break;
    case "range": S.range = +v; draw(); break;
    case "sugg-more": S.allSugg = !S.allSugg; draw(); break;
    case "demo-on": startDemo(); break;
    case "demo-off": S.demo = false; draw(); break;
    case "ask": askClaude(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target, f = el.dataset && el.dataset.field; if (!f) return; const m = M(); fresh();
  if (f === "event-pick"){ m.activeEvent = el.value; }
  else if (f === "meal"){ m.meals[el.dataset.d] = m.meals[el.dataset.d] || {}; m.meals[el.dataset.d][el.dataset.k] = el.value.slice(0, 80); }
  else if (f === "freq" || f === "min"){ const id = el.dataset.id, c = (m.custom || []).find(x => x.id === id), val = Math.max(0, Math.min(600, +el.value || 0));
    if (c) c[f] = f === "freq" ? (+el.value || 7) : val;
    else { m.over = m.over || {}; const o = m.over[id] = m.over[id] || {}; o[f] = f === "freq" ? +el.value : val; const base = CAT.find(x => x.id === id); if (o.freq === base.freq) delete o.freq; if (o.min === base.min) delete o.min; }
    fresh(); if (f === "freq"){ const t = task(id); delete m.slots[t.bundle && bundleOk(t) ? "b:" + t.bundle : id]; delete m.slots[id]; respread(false); toast(`${t.label}: ${slotText(t).toLowerCase()}.`); } }
  else if (f === "cap") m.cap = Math.min(12, Math.max(1, +el.value || 4));
  else if (f === "waterGoal") m.waterGoal = Math.max(250, +el.value || 2500);
  else if (f === "zone"){ m.zones = (m.zones || ZONES_DEFAULT).slice(); m.zones[+el.dataset.i] = el.value.slice(0, 120); }
  else if (f === "tour") m.tours[+el.dataset.i].s = el.value;
  else return;
  saveMain();
});
document.addEventListener("submit", e => {
  const form = e.target, k = form.dataset.form; if (!k) return; e.preventDefault();
  const fd = new FormData(form), t = String(fd.get("t") || "").trim().slice(0, 80), m = M();
  if (k === "supply" && t) m.supply.push({t, w:""});
  else if (k === "off"){ let a = String(fd.get("from")), z = String(fd.get("to") || a); if (!a) return; if (z < a) [a, z] = [z, a];
    if (diffDays(z, a) > 60){ toast("That's more than two months. Pick a shorter stretch, or pause an area in Plan instead."); return; }
    m.offDays = m.offDays || {}; for (let d = a; d <= z; d = addDays(d, 1)) m.offDays[d] = String(fd.get("why") || "Day off");
    const cut = addDays(today(), -120); Object.keys(m.offDays).forEach(d => { if (d < cut) delete m.offDays[d]; });
    S.offForm = false; toast(a === z ? `Day off on ${fmtDate(a)}. Rest well.` : `Days off from ${fmtDate(a)} to ${fmtDate(z)}.`); }
  else if (k === "list-new" && t){ m.lists = m.lists || []; const id = uidGen(); m.lists.unshift({id, name:t.slice(0, 50), items:[]}); saveMain(); document.getElementById("li-" + id)?.focus(); return; }
  else if (k === "li-add" && t){ const l = (m.lists || []).find(x => x.id === form.dataset.l); if (!l) return; l.items.push({id:uidGen(), t, done:false}); saveMain(); document.getElementById("li-" + l.id)?.focus(); return; }
  else if (k === "opt-rename" && t){ const key = form.dataset.k, i = +form.dataset.i, list = m.mealOptions[key], old = list[i];
    if (list.some((y, j) => j !== i && y.toLowerCase() === t.toLowerCase())){ toast(`${t} is already in your list.`); return; }
    list[i] = t.slice(0, 60); let n = 0; DAYS.forEach(d => { if (m.meals[d]?.[key] === old){ m.meals[d][key] = list[i]; n++; } });
    S.editOpt = null; toast(n ? `Renamed. Updated ${n} day${n === 1 ? "" : "s"} in this week's menu.` : "Renamed."); }
  else if (k === "daily-add"){ const label = String(fd.get("label") || "").trim().slice(0, 60); if (!label) return;
    const st = STACKS.find(x => x.id === fd.get("stack")) || STACKS[0];
    m.custom = m.custom || []; fresh(); m.custom.push({id:"c" + uidGen(), label, area:st.area, stack:st.id, freq:1, min:Math.max(1, +fd.get("min") || 5), always:!!fd.get("always")});
    toast(`Added ${label} to ${st.label}.`); }
  else if (k === "opt" && t){ const key = form.dataset.k; m.mealOptions = m.mealOptions || {B:[], L:[], D:[]};
    const list = m.mealOptions[key], add = String(fd.get("t")).split(",").map(x => x.trim().slice(0, 60)).filter(x => x && !list.some(y => y.toLowerCase() === x.toLowerCase()));
    list.push(...add); toast(add.length ? `Added ${add.length} ${MEAL_NAMES[key].toLowerCase()} option${add.length === 1 ? "" : "s"}.` : "Already in your list."); }
  else if (k === "host-item" && t){ const ev = curEvent(); ev.custom = ev.custom || []; ev.custom.push({id:uidGen(), sec:form.dataset.k, t}); }
  else if (k === "event"){ const name = String(fd.get("name") || "").trim().slice(0, 60); if (!name || !fd.get("date")) return;
    const ev = {id:uidGen(), name, date:String(fd.get("date")), guests:+fd.get("guests") || 0, checks:{}, custom:[]};
    m.events = m.events || []; m.events.unshift(ev); m.activeEvent = ev.id; S.newEvent = false; toast(`Checklist ready for ${name}.`); }
  else if (k === "movies" && t) m.movies.unshift({t, done:false});
  else if (k === "picnics" && t) m.picnics.unshift({t, done:false});
  else if (k === "tours" && t) m.tours.unshift({t, budget:String(fd.get("budget") || "").slice(0, 20), s:"Dreaming"});
  else if (k === "custom"){ const label = String(fd.get("label") || "").trim().slice(0, 60); if (!label) return;
    const id = "c" + uidGen(); m.custom = m.custom || []; fresh(); m.custom.push({id, label, area:AREAS[fd.get("area")] ? String(fd.get("area")) : "home", freq:+fd.get("freq") || 7, min:Math.max(1, +fd.get("min") || 30)});
    respread(false); toast(`Added ${label}: ${slotText(task(id)).toLowerCase()}.`); }
  else return;
  saveMain();
  const first = document.querySelector(`[data-form="${k}"] input`); if (first) first.focus();
});

/* ================= example data (memory only) ================= */
function startDemo(){
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const main = JSON.parse(JSON.stringify(S.main)); main.movies = [{t:"Example: Past Lives", done:true, r:4},{t:"Example: Laapataa Ladies", done:false}];
  S.demoMain = main; S.demo = true; fresh(); const logs = [];
  for (let i = 27; i >= 1; i--){ const d = addDays(today(), -i);
    main.water[d] = Math.round((1500 + rnd() * 1300) / 250) * 250;
    planFor(d).items.forEach(it => { const p = it.t.workout ? .55 : it.t.stack ? .85 : .75; if (rnd() < p)
      logs.push({id:"d" + logs.length, task:it.kind === "prep" ? it.t.id + ":prep" : it.t.id, date:d, min:Math.round(it.min * (.8 + rnd() * .45)), hour:it.t.stack === "morning" ? 7 : it.t.stack === "wind" ? 22 : it.t.stack === "knight" ? 19 : 11 + Math.floor(rnd() * 6), ts:parse(d).getTime()}); }); }
  S.demoLogs = logs; draw();
}

document.addEventListener("change", e => {
  if (e.target.id !== "restore-file" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (d.app !== "tend" || !d.main) throw 0;
      S.pendingRestore = {data:d, when:d.saved ? fmtDate(d.saved.slice(0, 10)) : "an unknown date"}; draw(); }
    catch(_){ toast("That file isn't a Tend backup. Pick a file named tend-backup-….json."); } };
  r.readAsText(e.target.files[0]);
});
// light / dark / auto, remembered on this device
function getTheme(){ try { return localStorage.getItem("tend.theme") || "auto"; } catch(e){ return "auto"; } }
function setTheme(t){ try { localStorage.setItem("tend.theme", t); } catch(e){}
  const root = document.documentElement; if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  const b = document.getElementById("themebtn"); if (b) b.textContent = {auto:"◐ Auto", light:"☀ Light", dark:"☾ Dark"}[t];
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = getComputedStyle(root).getPropertyValue("--bg").trim(); }
setTheme(getTheme());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTheme(getTheme()));

/* ================= boot ================= */
function ensureSlots(){ const m = M(), before = JSON.stringify(m.slots || {}) + (m.startedOn || ""); if (!m.startedOn) m.startedOn = today(); respread(false); return JSON.stringify(m.slots) + m.startedOn !== before; }
try { const t = localStorage.getItem("tend.tab"); if (t && TABS.some(x => x[0] === t)) S.tab = t; } catch(e){}
if (location.hash && TABS.some(x => x[0] === location.hash.slice(1))) S.tab = location.hash.slice(1);
loadLocal(); if (ensureSlots()) saveLocal(); draw();

(async () => {
  if (!window.claude || !window.claude.use) return;
  const [dbNs, user, smp] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
  if (smp){ sample = smp; if (S.tab === "insights") softDraw(); }
  if (!dbNs || !user) return;
  let id = null; try { id = await user.id(); } catch(e){}
  if (!id) return;
  db = dbNs; mainRef = db.doc(`data/users/${id}/main`); logsCol = mainRef.collection("logs");
  S.mode = "db"; softDraw();
  let first = true;
  mainRef.onSnapshot(snap => { if (writing || dirty) return;
    const d = snap.exists ? snap.data() : {};
    S.main = Object.assign(defaults(), d.version === 3 ? d : {water:d.water || {}, meals:d.meals || defaults().meals, movies:d.movies || [], picnics:d.picnics || [], tours:d.tours || []});
    if (ensureSlots() || (first && d.version !== 3)) flushMain(); first = false; softDraw(); },
    err => { if (err.code === "revoked"){ S.mode = "local"; loadLocal(); softDraw(); } });
  logsCol.where("date", ">=", addDays(today(), -100)).orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    S.logs = snap.docs.map(d => ({id:d.id, ...d.data()})); softDraw(); },
    err => { if (err.code === "revoked"){ S.mode = "local"; loadLocal(); softDraw(); } });
})();
